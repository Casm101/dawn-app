name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest Xcode on the runner
        run: |
          newest="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "$newest"
          xcodebuild -version
      - name: Package tests on macOS
        run: make test
      - name: Build iOS app unsigned
        run: make build
      - name: Build Watch app unsigned
        run: make build-watch
